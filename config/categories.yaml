  - category_id: general-models
    name: "General-Purpose Language Models"
    definition: "Open-weight large language models released by major AI labs, usable outside any single vendor's hosted API."
    ranking_profile: open_source_ai_tools_v1

  - category_id: coding-agents
    name: "AI Coding Agents"
    definition: "Agents and assistants that read, write, and execute code autonomously or semi-autonomously inside a developer's own environment."
    ranking_profile: open_source_ai_tools_v1

  - category_id: local-model-tools
    name: "Local Model Tools"
