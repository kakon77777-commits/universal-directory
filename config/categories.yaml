categories:
  - category_id: ai-crawler
    name: "AI Crawlers"
    definition: "Crawling tools that use semantic models to understand pages, generate or repair extraction rules, or convert web pages into LLM-usable formats."
    ranking_profile: open_source_ai_tools_v1

  - category_id: crawler-framework
    name: "Crawler Frameworks"
    definition: "Frameworks providing deterministic crawling infrastructure — URL frontier, retry, rate limiting, session management."
    ranking_profile: open_source_ai_tools_v1

  - category_id: browser-agent
    name: "Browser Agents"
    definition: "AI-driven automation tools that autonomously decide browser interactions — clicking, typing, scrolling, navigating."
    ranking_profile: open_source_ai_tools_v1

  - category_id: research-agent
    name: "Deep Research Agents"
    definition: "Research agents that automatically search, read, cross-verify multiple sources, and generate cited reports."
    ranking_profile: open_source_ai_tools_v1

  - category_id: agent-orchestration
    name: "Agent Orchestration Platforms"
    definition: "Platforms providing scheduling, skills, multi-agent routing, and long-running control planes."
    ranking_profile: open_source_ai_tools_v1

