# Seed entity list: curated from 網路爬蟲、AI 爬蟲與 Agent 自動化搜尋技術整理
# (2026-07-14), section 17-31. This is the human-confirmed candidate list that
# stands in for Discovery Agent + 人工確認候選 in the UDCD MVP loop
# (doc2 Appendix D). homepage == github_repo deliberately: doc1 doesn't
# establish a separate marketing domain for these tools with certainty, and
# GitHub itself is a valid, always-correct source rather than guessing one.
#
# taglines are English-primary (site default language) — see
# src/directory/i18n.py's CONTENT_ZH for the Traditional Chinese versions,
# keyed by these exact English strings.

entities:
  - canonical_name: Crawl4AI
    entity_type: open_source_tool
    tagline: "Local, self-hosted, LLM-friendly web crawler"
    github_repo: unclecode/crawl4ai
    primary_category: ai-crawler
    license_hint: Apache-2.0

