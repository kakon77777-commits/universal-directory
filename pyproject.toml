[project]
name = "universal-directory"
version = "0.1.0"
description = "UDCD MVP: entity/category directory ingested via ai-web-research, deterministically scored, statically published"
requires-python = ">=3.11"
dependencies = [
    "ai-web-research @ file:///D:/Ai/work%20together/ai-web-research",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
directory = "directory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/directory"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
